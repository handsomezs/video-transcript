[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-transcript"
version = "0.1.0"
description = "Extract transcripts from YouTube, Bilibili, and local video files"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "yt-dlp>=2024.0",
    "faster-whisper>=1.0",
    "click>=8.0",
    "gradio>=4.0",
    "ffmpeg-python>=0.2",
]

[project.scripts]
transcript = "transcript.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
